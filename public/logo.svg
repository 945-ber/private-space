<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a2a"/>
      <stop offset="1" stop-color="#145c41"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22a05a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffcf6e"/>
    </linearGradient>
  </defs>
  <!-- 圆形底 -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <!-- 树冠（三个圆叠成云状） -->
  <circle cx="68" cy="74" r="34" fill="url(#crown)"/>
  <circle cx="132" cy="74" r="34" fill="url(#crown)"/>
  <circle cx="100" cy="58" r="38" fill="url(#crown)"/>
  <!-- 树干 -->
  <rect x="84" y="96" width="32" height="60" rx="7" fill="#8a5a2b"/>
  <rect x="89" y="96" width="7" height="56" rx="3" fill="#7a4d22" opacity="0.55"/>
  <!-- 树干上的树洞 -->
  <ellipse cx="100" cy="120" rx="11" ry="15" fill="#241505"/>
  <!-- 洞中暖光 -->
  <ellipse cx="100" cy="116" rx="5" ry="7" fill="url(#glow)"/>
  <!-- 底部草地 -->
  <path d="M38 148 q62 26 124 0 v44 h-124 z" fill="#0b2e1f"/>
</svg>