<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>树洞 · 登录</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="lang-switch">
    <button onclick="setLang('zh')">中文</button>
    <button onclick="setLang('en')">EN</button>
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('de')">DE</button>
  </div>

  <!-- 欢迎开场动画（同会话只播一次） -->
  <div class="auth-intro" id="auth-intro">
    <div class="intro-particles" id="intro-particles"></div>
    <img src="logo.svg" class="intro-logo" alt="logo">
    <div class="intro-title" id="intro-title"></div>
    <div class="intro-sub" id="intro-sub"></div>
  </div>

  <div class="auth-wrap">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
    <div class="auth-orb auth-orb-4"></div>
    <div class="auth-card">
      <div class="auth-logo"><img src="logo.svg" alt="logo"></div>
      <h1 data-i18n="app">树洞</h1>
      <p class="subtitle" data-i18n="sub">话题广场 · 专属房间 · 私密交流</p>

      <div class="tabs">
        <button id="tab-login" class="active" onclick="switchTab('login')" data-i18n="login">登录</button>
        <button id="tab-register" onclick="switchTab('register')" data-i18n="register">注册</button>
      </div>

      <div id="msg" class="msg"></div>

      <form id="form-login" onsubmit="return submitLogin(event)">
        <div class="form-group">
          <label data-i18n="user">用户名</label>
          <input id="login-user" type="text" autocomplete="username" data-i18n-ph="phUser" placeholder="输入用户名" required>
        </div>
        <div class="form-group">
          <label data-i18n="pass">密码</label>
          <input id="login-pass" type="password" autocomplete="current-password" data-i18n-ph="phPass" placeholder="输入密码" required>
        </div>
        <button class="btn" type="submit" data-i18n="loginBtn">登 录</button>
      </form>

      <form id="form-register" class="hidden" onsubmit="return submitRegister(event)">
        <div class="form-group">
          <label data-i18n="regUser">用户名（2-20位字母/数字/下划线/中文）</label>
          <input id="reg-user" type="text" autocomplete="username" data-i18n-ph="phRegUser" placeholder="设置用户名" required>
        </div>
        <div class="form-group">
          <label data-i18n="regPass">密码（至少6位）</label>
          <input id="reg-pass" type="password" autocomplete="new-password" data-i18n-ph="phRegPass" placeholder="设置密码" required>
        </div>
        <div class="form-group">
          <label data-i18n="regPass2">确认密码</label>
          <input id="reg-pass2" type="password" autocomplete="new-password" data-i18n-ph="phRegPass2" placeholder="再次输入密码" required>
        </div>
        <button class="btn" type="submit" data-i18n="regBtn">注 册</button>
      </form>
    </div>
  </div>

  <script>
    // ===== 多语言（登录页）=====
    var I18N = {
      zh: { app:'树洞', sub:'话题广场 · 专属房间 · 私密交流', login:'登录', register:'注册', user:'用户名', pass:'密码', loginBtn:'登 录', regBtn:'注 册', regUser:'用户名（2-20位字母/数字/下划线/中文）', regPass:'密码（至少6位）', regPass2:'确认密码', phUser:'输入用户名', phPass:'输入密码', phRegUser:'设置用户名', phRegPass:'设置密码', phRegPass2:'再次输入密码', errDiff:'两次输入的密码不一致', errLogin:'登录失败', errReg:'注册失败', errBadLogin:'用户名或密码错误', errTaken:'该用户名已被注册', errEmpty:'用户名和密码不能为空', errBadFmt:'用户名需为2-20位字母/数字/下划线/中文', errPwd:'密码至少 6 位', errServer:'服务器内部错误' },
      en: { app:'Tree Hole', sub:'Topics · Private Rooms · Secret Chat', login:'Log in', register:'Sign up', user:'Username', pass:'Password', loginBtn:'Log In', regBtn:'Sign Up', regUser:'Username (2-20 letters, numbers, _ or Chinese)', regPass:'Password (at least 6 chars)', regPass2:'Confirm password', phUser:'Enter username', phPass:'Enter password', phRegUser:'Choose username', phRegPass:'Choose password', phRegPass2:'Repeat password', errDiff:'Passwords do not match', errLogin:'Login failed', errReg:'Registration failed', errBadLogin:'Wrong username or password', errTaken:'Username already taken', errEmpty:'Username and password required', errBadFmt:'Username must be 2-20 characters', errPwd:'Password at least 6 characters', errServer:'Server error' },
      fr: { app:'Trou d\u2019arbre', sub:'Sujets · Chambres priv\u00e9es · Discussions secr\u00e8tes', login:'Connexion', register:'Inscription', user:'Nom d\u2019utilisateur', pass:'Mot de passe', loginBtn:'Se connecter', regBtn:'S\u2019inscrire', regUser:'Nom (2-20 lettres, chiffres, _ ou chinois)', regPass:'Mot de passe (6 caract\u00e8res min.)', regPass2:'Confirmer le mot de passe', phUser:'Entrer le nom', phPass:'Entrer le mot de passe', phRegUser:'Choisir un nom', phRegPass:'Choisir un mot de passe', phRegPass2:'R\u00e9p\u00e9ter le mot de passe', errDiff:'Les mots de passe diff\u00e8rent', errLogin:'\u00c9chec de connexion', errReg:'\u00c9chec d\u2019inscription', errBadLogin:'Nom ou mot de passe incorrect', errTaken:'Ce nom est d\u00e9j\u00e0 pris', errEmpty:'Nom et mot de passe requis', errBadFmt:'Le nom doit faire 2-20 caract\u00e8res', errPwd:'Mot de passe : 6 caract\u00e8res min.', errServer:'Erreur serveur' },
      de: { app:'Baumloch', sub:'Themen · Private R\u00e4ume · Geheimer Chat', login:'Anmelden', register:'Registrieren', user:'Benutzername', pass:'Passwort', loginBtn:'Anmelden', regBtn:'Registrieren', regUser:'Name (2-20 Buchstaben, Zahlen, _ oder Chinesisch)', regPass:'Passwort (mind. 6 Zeichen)', regPass2:'Passwort best\u00e4tigen', phUser:'Benutzername eingeben', phPass:'Passwort eingeben', phRegUser:'Benutzername w\u00e4hlen', phRegPass:'Passwort w\u00e4hlen', phRegPass2:'Passwort wiederholen', errDiff:'Passw\u00f6rter stimmen nicht \u00fcberein', errLogin:'Anmeldung fehlgeschlagen', errReg:'Registrierung fehlgeschlagen', errBadLogin:'Falscher Benutzername oder falsches Passwort', errTaken:'Benutzername bereits vergeben', errEmpty:'Benutzername und Passwort erforderlich', errBadFmt:'Benutzername: 2-20 Zeichen', errPwd:'Passwort: mindestens 6 Zeichen', errServer:'Serverfehler' }
    };
    var lang = localStorage.getItem('sd_lang') || 'zh';
    function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key; }
    var ERR_MAP = { '用户名或密码错误':'errBadLogin', '该用户名已被注册':'errTaken', '用户名和密码不能为空':'errEmpty', '用户名需为2-20位字母/数字/下划线/中文':'errBadFmt', '密码至少 6 位':'errPwd', '服务器内部错误':'errServer' };
    function eMsg(e) { return (typeof e === 'string' && ERR_MAP[e]) ? t(ERR_MAP[e]) : e; }
    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
      document.documentElement.lang = lang;
      var introT = document.getElementById('intro-title');
      if (introT && !introT.dataset.played) introT.dataset.text = t('app');
    }
    function setLang(l) { lang = l; localStorage.setItem('sd_lang', l); applyLang(); }

    // 欢迎开场动画：同一会话只播放一次，之后直接进入登录
    (function () {
      const intro = document.getElementById('auth-intro');
      if (!intro) return;
      const welcomed = sessionStorage.getItem('welcomed');
      if (welcomed) {
        intro.style.display = 'none';
        return;
      }
      sessionStorage.setItem('welcomed', '1');
      document.getElementById('intro-sub').textContent = t('sub');
      const wrap = document.getElementById('intro-particles');
      for (let i = 0; i < 16; i++) {
        const d = document.createElement('span');
        d.className = 'pt';
        d.style.left = Math.random() * 100 + '%';
        d.style.width = d.style.height = (2 + Math.random() * 5) + 'px';
        d.style.animationDelay = Math.random() * 4 + 's';
        d.style.animationDuration = (4 + Math.random() * 6) + 's';
        wrap.appendChild(d);
      }
      const tt = document.getElementById('intro-title');
      const text = t('app');
      tt.dataset.text = text;
      let i = 0;
      const iv = setInterval(() => {
        tt.textContent = text.slice(0, ++i);
        if (i >= text.length) clearInterval(iv);
      }, 190);
      setTimeout(() => intro.classList.add('hide'), 2500);
    })();

    applyLang();

    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
      document.getElementById('msg').textContent = '';
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (type || '');
    }

    async function api(url, data) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(data || {})
      });
      return res.json();
    }

    async function submitLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;
      const result = await api('/api/login', { username, password });
      if (result.ok) {
        location.href = 'chat.html';
      } else {
        showMsg(eMsg(result.error) || t('errLogin'), 'error');
      }
    }

    async function submitRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-user').value.trim();
      const password = document.getElementById('reg-pass').value;
      const password2 = document.getElementById('reg-pass2').value;
      if (password !== password2) {
        showMsg(t('errDiff'), 'error');
        return;
      }
      const result = await api('/api/register', { username, password });
      if (result.ok) {
        location.href = 'chat.html';
      } else {
        showMsg(eMsg(result.error) || t('errReg'), 'error');
      }
    }

    (async function () {
      const res = await fetch('/api/me', { credentials: 'include' });
      const data = await res.json();
      if (data.user) location.href = 'chat.html';
    })();
  </script>
</body>
</html>
